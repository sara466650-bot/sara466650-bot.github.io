<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBF9F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Workouts">
<meta name="application-name" content="My Workouts">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>My Workouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&family=Readex+Pro:wght@400;500;600&display=swap">
<style>
:root{--paper:#FBF9F5;--ink:#1A1C18;--muted:#6B6D66;--rule:#E2E0DA;--red:#9A3A2E}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Readex Pro","Segoe UI",Tahoma,sans-serif;-webkit-text-size-adjust:100%}
.lock{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px))}
.lock img{width:84px;height:84px;border-radius:19px;box-shadow:0 6px 18px rgba(26,28,24,.12)}
.lock h1{margin:16px 0 26px;font:900 24px/1.2 Cairo,"Segoe UI",sans-serif}
.lock form{display:flex;flex-direction:column;gap:10px;width:min(280px,100%)}
.lock label{font-size:13px;color:var(--muted);text-align:center}
.lock input{font:600 22px/1 "Readex Pro","Segoe UI",sans-serif;letter-spacing:3px;text-align:center;direction:ltr;padding:14px 12px;border:1px solid var(--rule);border-radius:12px;background:#fff;color:var(--ink);outline:none;-webkit-appearance:none}
.lock input:focus{border-color:var(--ink)}
.lock button{font:700 16px/1 Cairo,"Segoe UI",sans-serif;padding:15px;border:0;border-radius:12px;background:var(--ink);color:var(--paper)}
.lock button:disabled{opacity:.5}
.lock .err{min-height:18px;font-size:13px;color:var(--red);text-align:center}
</style>
</head>
<body>
<main class="lock" id="lock" hidden>
  <img src="icons/apple-touch-icon.png" alt="">
  <h1>My Workouts</h1>
  <form id="form" autocomplete="off">
    <label for="code">الرمز</label>
    <input id="code" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="24">
    <button id="go" type="submit">فتح</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>

<script>
/* التطبيق نفسه مشفّر داخل #box. بعد أول فتح بالرمز ينحفظ المفتاح في الجهاز ويفتح لحاله. */
(function () {
  'use strict';
  var KEY = 'mw-key', LEN = 12;
  var lock = document.getElementById('lock'), form = document.getElementById('form');
  var input = document.getElementById('code'), go = document.getElementById('go'), err = document.getElementById('err');
  var box = JSON.parse(document.getElementById('box').textContent);
  var subtle = window.crypto && window.crypto.subtle;

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

  function bytes(b64) {
    var s = atob(b64), a = new Uint8Array(s.length), i;
    for (i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }
  function b64(buf) {
    var a = new Uint8Array(buf), s = '', i;
    for (i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }
  function digits(s) {
    return String(s)
      .replace(/[٠-٩]/g, function (d) { return String(d.charCodeAt(0) - 0x0660); })
      .replace(/[۰-۹]/g, function (d) { return String(d.charCodeAt(0) - 0x06F0); })
      .replace(/\D/g, '');
  }
  function derive(code) {
    return subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) {
        return subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(box.s), iterations: box.i }, k, 512);
      });
  }
  function unlock(bits) {
    var raw = new Uint8Array(bits), iv = bytes(box.v), ct = bytes(box.c);
    var signed = new Uint8Array(iv.length + ct.length);
    signed.set(iv, 0);
    signed.set(ct, iv.length);
    return subtle.importKey('raw', raw.slice(32, 64), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify'])
      .then(function (k) { return subtle.verify('HMAC', k, bytes(box.t), signed); })
      .then(function (ok) {
        if (!ok) throw new Error('wrong code');
        return subtle.importKey('raw', raw.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
      })
      .then(function (k) { return subtle.decrypt({ name: 'AES-CBC', iv: iv }, k, ct); })
      .then(function (plain) { return new TextDecoder().decode(plain); });
  }
  function start(html) {
    document.open();
    document.write(html);
    document.close();
  }
  function ask() {
    lock.hidden = false;
    try { input.focus(); } catch (x) {}
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = digits(input.value), bits;
    if (!code || go.disabled) return;
    go.disabled = true;
    err.textContent = '';
    derive(code)
      .then(function (b) { bits = b; return unlock(b); })
      .then(function (html) {
        try { localStorage.setItem(KEY, b64(bits)); } catch (x) {}
        start(html);
      }, function () {
        go.disabled = false;
        err.textContent = 'الرمز غير صحيح';
        try { input.select(); } catch (x) {}
      });
  });
  input.addEventListener('input', function () {
    if (digits(input.value).length === LEN && !go.disabled) go.click();
  });

  function boot() {
    var saved = null;
    if (!subtle) { ask(); go.disabled = true; err.textContent = 'هذا المتصفح لا يدعم فتح التطبيق'; return; }
    try { saved = localStorage.getItem(KEY); } catch (x) {}
    if (!saved) { ask(); return; }
    unlock(bytes(saved).buffer).then(start, function () {
      try { localStorage.removeItem(KEY); } catch (x) {}
      ask();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
