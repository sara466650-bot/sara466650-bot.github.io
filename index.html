<style>
:root{--ivory:#F7F4EF;--soft:#FBF9F5;--hair:#D9CFBE;--hair2:#E5DCC9;--gold:#B88A2E;--ink:#2B2118;--ink3:#8A7A66;--red:#8C3A2E;--ease:cubic-bezier(.22,.61,.36,1)}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ivory,#F7F4EF);color:var(--ink,#2B2118)}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border-radius:0;cursor:pointer;-webkit-appearance:none}
button:active{opacity:.85}
.lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;direction:rtl}
.hero{position:relative;height:296px;flex:none;overflow:hidden;background:#E9E1D6}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 38%;display:block;animation:veil 900ms var(--ease)}
.hero i{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(247,244,239,.28) 0%,rgba(247,244,239,.06) 42%,rgba(247,244,239,.92) 88%,#F7F4EF 100%)}
@keyframes veil{from{opacity:0}to{opacity:1}}
.body{flex:1;display:flex;flex-direction:column;padding:0 28px calc(34px + env(safe-area-inset-bottom,0px));margin-top:-46px;position:relative}
.brand{display:flex;flex-direction:column;align-items:center;gap:14px}
.mark{width:56px;height:56px;border:1px solid var(--hair);background:var(--soft);display:grid;place-items:center;box-shadow:0 1px 2px rgba(43,33,24,.04)}
.word{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;line-height:1.3;letter-spacing:.26em;text-transform:uppercase;direction:ltr;white-space:nowrap}
.sub{font-size:12.5px;color:var(--ink3);letter-spacing:.02em}
.eyebrow{font-family:"Inter",Arial,sans-serif;font-size:9.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--ink3);text-align:center;direction:ltr}
.cells{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:14px;direction:ltr}
.cells i{height:26px;border-bottom:2px solid var(--hair);display:block;transition:border-color 180ms var(--ease)}
.cells i.on{border-color:var(--ink)}
.count{font-family:"Inter",Arial,sans-serif;font-size:10.5px;color:var(--ink3);text-align:center;margin-top:9px;font-variant-numeric:tabular-nums;direction:ltr}
.err{min-height:18px;margin-top:6px;font-size:12px;color:var(--red);text-align:center}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px;direction:ltr}
.keys button{height:50px;border:1px solid var(--hair2);background:var(--soft);font-family:"Inter",Arial,sans-serif;font-size:17px;transition:background 180ms var(--ease)}
.keys button.small{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:14px;color:var(--ink3)}
.go{margin-top:auto;padding-top:24px}
.go button{width:100%;height:52px;font-size:15px;font-weight:500;letter-spacing:.06em;border:1px solid var(--hair);background:transparent;color:var(--ink3);transition:background 320ms var(--ease),color 320ms var(--ease)}
.go button.ready{background:var(--ink);border-color:var(--ink);color:var(--ivory)}
.hint{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;color:var(--ink3);font-size:11px}
</style>
</head>

<script>
/* التطبيق نفسه مشفّر داخل #box. بعد أول فتح بالرمز ينحفظ المفتاح في الجهاز ويفتح لحاله. */
(function () {
  'use strict';
  var KEY = 'mw-key', LEN = 12, pin = '', busy = false;
  var lock = document.getElementById('lock'), cells = document.getElementById('cells'), count = document.getElementById('count');
  var keys = document.getElementById('keys'), go = document.getElementById('go'), err = document.getElementById('err');
  var box = JSON.parse(document.getElementById('box').textContent);
  var subtle = window.crypto && window.crypto.subtle;

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length), i; for (i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function b64(buf) { var a = new Uint8Array(buf), s = '', i; for (i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function derive(code) {
    return subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: bytes(box.s), iterations: box.i}, k, 512); });
  }
  function unlock(bits) {
    var raw = new Uint8Array(bits), iv = bytes(box.v), ct = bytes(box.c), signed = new Uint8Array(iv.length + ct.length);
    signed.set(iv, 0); signed.set(ct, iv.length);
    return subtle.importKey('raw', raw.slice(32, 64), {name: 'HMAC', hash: 'SHA-256'}, false, ['verify'])
      .then(function (k) { return subtle.verify('HMAC', k, bytes(box.t), signed); })
      .then(function (ok) { if (!ok) throw new Error('wrong code'); return subtle.importKey('raw', raw.slice(0, 32), {name: 'AES-CBC'}, false, ['decrypt']); })
      .then(function (k) { return subtle.decrypt({name: 'AES-CBC', iv: iv}, k, ct); })
      .then(function (plain) { return new TextDecoder().decode(plain); });
  }
  function start(html) { document.open(); document.write(html); document.close(); }

  function paint() {
    var h = '', i;
    for (i = 0; i < LEN; i++) h += '<i class="' + (i < pin.length ? 'on' : '') + '"></i>';
    cells.innerHTML = h;
    count.textContent = pin.length + ' / 12';
    go.className = pin.length === LEN ? 'ready' : '';
  }
  function tryOpen() {
    if (busy || pin.length !== LEN) return;
    busy = true; err.textContent = ''; go.textContent = 'لحظة…';
    var bits;
    derive(pin).then(function (b) { bits = b; return unlock(b); }).then(function (html) {
      try { localStorage.setItem(KEY, b64(bits)); } catch (x) {}
      start(html);
    }, function () {
      busy = false; go.textContent = 'فتح'; err.textContent = 'الرمز غير صحيح'; pin = ''; paint();
    });
  }
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'مسح', '0', '↺'].forEach(function (l) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = l;
    if (l === 'مسح' || l === '↺') b.className = 'small';
    b.setAttribute('aria-label', l === 'مسح' ? 'مسح رقم' : l === '↺' ? 'مسح الكل' : l);
    b.addEventListener('click', function () {
      if (busy) return;
      err.textContent = '';
      if (l === 'مسح') pin = pin.slice(0, -1);
      else if (l === '↺') pin = '';
      else if (pin.length < LEN) pin += l;
      paint();
      if (pin.length === LEN) tryOpen();
    });
    keys.appendChild(b);
  });
  go.addEventListener('click', tryOpen);

  function ask() { lock.hidden = false; paint(); }
  function boot() {
    var saved = null;
    if (!subtle) { ask(); err.textContent = 'هذا المتصفح لا يدعم فتح التطبيق'; return; }
    try { saved = localStorage.getItem(KEY); } catch (x) {}
    if (!saved) { ask(); return; }
    unlock(bytes(saved).buffer).then(start, function () { try { localStorage.removeItem(KEY); } catch (x) {} ask(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
